[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lease-trace"
version = "0.1.0"
description = "Lease abstraction where every extracted field is traceable to verbatim contract text"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "beautifulsoup4>=4.12",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "reportlab>=4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
